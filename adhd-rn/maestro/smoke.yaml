appId: com.adhd.parentcoach
---
- launchApp
- assertVisible: "先认识孩子"
- tapOn:
    id: "onboarding-name-input"
- inputText: "小安"
- tapOn: "6-8岁"
- tapOn:
    id: "onboarding-next"
- tapOn: "注意力短"
- tapOn:
    id: "onboarding-next"
- tapOn: "10分钟"
- tapOn: "妈妈"
- tapOn:
    id: "onboarding-generate"
- assertVisible: "今天只做"
- tapOn:
    id: "today-quick-log"
- assertVisible: "每日记录"
- tapOn:
    id: "event-note-input"
- inputText: "孩子今天配合收玩具"
- tapOn:
    id: "event-add"
- tapOn:
    id: "log-save"
- tapOn: "医生"
- assertVisible: "AI 医生复盘"
